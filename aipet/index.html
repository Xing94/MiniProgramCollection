<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>AI 微信虚拟宠物</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <button id="toggleCamBtn" class="secondary">关闭摄像头 📷</button>
    <div
      id="cam-mini-window"
      style="
        position: fixed;
        bottom: 15px;
        left: 15px;
        width: 140px;
        height: 105px;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid rgba(124, 157, 255, 0.5);
        transform: scaleX(-1);
        z-index: 100;
        background: #000;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      "
    >
      <video
        id="webcam"
        style="width: 100%; height: 100%; object-fit: cover"
        playsinline
      ></video>
    </div>

    <div class="container">
      <div class="card">
        <div class="header">
          <div>
            <div class="title">Dada 电子宠物</div>
            <div class="muted" id="statusText">连接中…</div>
          </div>
          <div class="chips">
            <div class="chip" id="ageChip">年龄 0 天</div>
            <div class="chip" id="moodChip">心情🙂</div>
            <div class="chip" id="energyChip">精力良好</div>
          </div>
        </div>
        <div class="pet-wrap">
          <div class="avatar">
            <video id="webcam" style="display: none" playsinline></video>

            <div
              id="effectLayer"
              style="position: absolute; pointer-events: none"
            ></div>

            <!-- 小狗动画 SVG -->
            <svg
              class="face"
              id="dogSvg"
              style="position: relative; z-index: 2"
              viewBox="0 0 100 100"
            >
              <path
                id="dogTail"
                d="M15,70 Q5,60 15,50"
                stroke="#6d4c2b"
                stroke-width="6"
                fill="none"
                stroke-linecap="round"
              />
              <ellipse
                id="earLeft"
                cx="25"
                cy="30"
                rx="15"
                ry="22"
                fill="#6d4c2b"
              />
              <ellipse
                id="earRight"
                cx="75"
                cy="30"
                rx="15"
                ry="22"
                fill="#6d4c2b"
              />
              <ellipse
                cx="50"
                cy="55"
                rx="35"
                ry="38"
                fill="#c89f6a"
                stroke="#a87c4f"
                stroke-width="2"
              />
              <ellipse id="eyeLeft" cx="38" cy="55" rx="6" ry="7" fill="#fff" />
              <ellipse
                id="eyeRight"
                cx="62"
                cy="55"
                rx="6"
                ry="7"
                fill="#fff"
              />
              <ellipse
                id="pupilLeft"
                cx="38"
                cy="57"
                rx="2"
                ry="2.5"
                fill="#222"
              />
              <ellipse
                id="pupilRight"
                cx="62"
                cy="57"
                rx="2"
                ry="2.5"
                fill="#222"
              />
              <ellipse cx="50" cy="68" rx="5" ry="4" fill="#222" />
              <path
                id="dogMouth"
                d="M44,75 Q50,80 56,75"
                stroke="#222"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
              />
            </svg>

            <div
              id="particleContainer"
              style="
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
              "
            ></div>

            <canvas
              id="petCanvas"
              style="
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
              "
            ></canvas>
          </div>
          <div class="col">
            <div class="stats">
              <div class="stat">
                <div>饱腹感 <span class="muted" id="hungerVal">100</span></div>
                <div class="bar">
                  <i id="hungerBar" style="width: 100%"></i>
                </div>
              </div>
              <div class="stat">
                <div>心情 <span class="muted" id="happyVal">100</span></div>
                <div class="bar"><i id="happyBar" style="width: 100%"></i></div>
              </div>
              <div class="stat">
                <div>能量 <span class="muted" id="energyVal">100</span></div>
                <div class="bar">
                  <i id="energyBar" style="width: 100%"></i>
                </div>
              </div>
            </div>
            <div class="actions">
              <button id="feedBtn">喂食 🍩</button>
              <button id="playBtn">玩耍 🎮</button>
              <button id="sleepBtn">小憩 😴</button>
              <button id="gameBtn" class="primary">玩游戏 ♟️</button>
              <button id="adventureBtn" class="secondary">冒险日记 📖</button>
              <button class="primary" id="talkBtn">和我聊天 💬</button>
              <button id="clearChatBtn">清除聊天记录 🗑️</button>
            </div>
          </div>
        </div>
        <div class="log" id="log"></div>
        <div class="composer">
          <input
            type="text"
            id="input"
            maxlength="120"
            placeholder="对宠物说点什么…（在微信内置浏览器可直接使用）"
          />
          <button id="send">发送</button>
        </div>
        <div class="footer">
          数据仅保存在本机（localStorage）。把此页面部署到任意静态托管，就能在微信里直接打开使用。
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <div id="gameModal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <div id="gameHeader">
          <span id="gameTitle">Dada 的游戏室</span>
          <button id="closeGameBtn">✕</button>
        </div>
        <div id="gameBody"></div>
      </div>
    </div>

    <div id="adventureModal" class="modal-overlay" style="display:none;">
      <div class="modal-content"
        style="max-width: 600px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; position: relative; padding: 0;">

        <div id="adventureHeader"
          style="display:flex; justify-content:space-between; align-items:center; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0;">
          <span id="adventureTitle">Dada 的冒险足迹</span>
          <button id="closeAdventureBtn"
            style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">✕</button>
        </div>

        <div id="adventureBody" style="flex: 1; overflow-y: auto; padding: 20px;">
        </div>

      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="main.js"></script>
    <script src="game/wuziqi.js"></script>
    <script src="game/xiangqi.js"></script>
    <script src="game/game.js"></script>
    <script src="game/adventure.js"></script>
    <script src="deepseek.js"></script>
  </body>
</html>
